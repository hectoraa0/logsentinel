line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "N"]
# timezone.utc is clearer to readers than the datetime.UTC alias.
ignore = ["UP017"]

[lint.per-file-ignores]
# Sample-data generator and tests contain long literal log lines.
"scripts/*" = ["E501"]
"tests/*" = ["E501"]
