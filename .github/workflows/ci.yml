name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint (ruff)
        run: |
          pip install ruff
          ruff check .
      - name: Unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Detection smoke test on sample logs
        # The sample data contains a critical attack, so the analyzer MUST exit with
        # code 2. Any other code means a detection rule regressed.
        run: |
          set +e
          PYTHONPATH=src python -m logsentinel analyze \
            --auth data/sample/auth.log --nginx data/sample/nginx_access.log \
            --db /tmp/alerts.db --year 2026 --fail-on critical
          code=$?
          echo "exit code: $code"
          test "$code" -eq 2

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Static security analysis (bandit)
        run: |
          pip install bandit
          bandit -r src -ll

  docker:
    runs-on: ubuntu-latest
    needs: [lint-and-test]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the dashboard
        run: |
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/healthz && exit 0
            sleep 1
          done
          echo "dashboard did not become healthy" >&2
          exit 1
      - name: Smoke test the dashboard
        run: |
          curl --fail --silent http://127.0.0.1:8000/healthz
          curl --fail --silent http://127.0.0.1:8000/api/stats > stats.json
          cat stats.json
          grep -q '"total": 10' stats.json
          curl --silent --dump-header headers.txt --output /dev/null http://127.0.0.1:8000/
          grep -qi "content-security-policy" headers.txt
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v
